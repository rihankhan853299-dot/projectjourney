<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter 2</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
    }

    body {
        background-color: aquamarine;
    }

    h1 {
        justify-content: center;
        display: flex;
        background-color: rgb(184, 11, 126);
        border-radius: 50px;
    border: 5px solid #00cc99;
        margin-top: 55px;
        width: 10%;
        margin-left: 600px;
    }

    .container {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    button {
        background-color: chartreuse;
        border-radius: 10px;
        border: 3px solid black;
        padding: 10px;
        margin-top: 100px;
    }

    button:hover {
        background-color: #cc00cc;
    }
    .outher{
     color: rebeccapurple;
     justify-content: center;
     display: flex;
     margin-top: 50px;
    }
</style>

<body>
    <div class="container1">
    <h1 id="output"> result</h1>
    <h3 class="outher">THis Created BY Rihan khan</h3>
    <div class="container">
        <button id="increament" onclick="increament()">increament</button>
        <button id="decreament" onclick="decreament()">decreament</button>
        <button id="reset" onclick="reset()">reset</button>
    </div>
    </div>
</body>
<script>
    let tasbeeh = 0;
    let output = document.getElementById("output");
    function increament() {
if(tasbeeh==52){
            return;
        }
        tasbeeh++;
        output.innerText = tasbeeh; // tasbeeh naam ke variable ki value ko increament karke ouput naam ki heading ke anadar store ka dena
    }
function decreament(){

    tasbeeh--;

    output.innerText=tasbeeh;
}
    function reset(){
        tasbeeh=0;
        output.innerText=tasbeeh;

        // mean of this function---> reset button par click karne par tasbeeh ki value zero kar dena
    }
</script>

</html>
