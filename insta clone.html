<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap Icons link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <header>
        <div class="grnd-parent">

            <div class="plus">
<i class="bi bi-plus-lg"></i>
<h4>Instagram</h4>
<i class="bi bi-heart-fill"></i>
            </div>

         
            <!-- Story Section -->
            <section class="story-section">

                <div>

                        <i class="bi bi-plus-lg add-story"></i>
                    <img class="str1" src="https://i.pinimg.com/736x/b4/be/22/b4be22b63582f8902e2d53f0379ff98b.jpg"
                        alt="Story">
                    <p class="frnd">Your Story</p>
                </div>

                <div>
                    <img class="str1" src="https://i.pinimg.com/736x/b4/be/22/b4be22b63582f8902e2d53f0379ff98b.jpg"
                        alt="Story">
                    <p class="frnd">Friend 1</p>
                </div>

                <div>
                    <img class="str1" src="https://i.pinimg.com/736x/b4/be/22/b4be22b63582f8902e2d53f0379ff98b.jpg"
                        alt="Story">
                    <p class="frnd">Friend 2</p>
                </div>

                <div>
                    <img class="str1" src=" https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCBqaUcLYTba5peN9NUvWVK5X9GwsIxIkSTT6M5PLAwFsYwaXvM1Xm_Qc&s=10  "
                        alt="Story">
                    <p class="frnd">Friend 3</p>
                </div>

            </section>

            <!-- Post Section -->
            <section class="post-section">

                <div class="post">

                    <img class="pst1" src="https://i.pinimg.com/736x/b4/be/22/b4be22b63582f8902e2d53f0379ff98b.jpg"
                        alt="Post">
<p class="usrname">its_najim9087</p>
                    <br>

                    <img class="pst"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDqYf1btUKRxqcHxd3L6cLsYxxNKZTkNXQ_PyB_sRvD1Fw2V0bv6Btqeoq&s=10"
                        alt="">

                </div>
            </section>

        </div>
    </header>


    <!-- Bootstrap Heart Icon -->
    <main>
        <section class="icon-section">
            <i  id="red" class="bi bi-heart like-icon"></i>

            <i class="bi bi-chat like-icon"></i>

            <i class="bi bi-send like-icon"></i>

            <i class="bi bi-bookmark like-icon save"></i>
        </section>
<p class="para">  Paisa zindagi ka ek zaroori hissa hai, par ye sach hai ki "paisa sab kuch nahi hota". Yeh sirf ek zariya hai, jisse hum zarooratein poori kar sakte hain. Sacchi khushiyan, sukoon, aur rishte paise se nahi kharide ja sakte. </p>


    </main>
<footer>
<div class="hom-icon">
<ul class="icons">
<i class="bi bi-house"></i>
<i class="bi bi-file-play-fill"></i>
<i class="bi bi-send-arrow-up-fill"></i>
<i class="bi bi-search"></i>
<i class="bi bi-person-circle"></i>
</ul>


</div>



</footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="Script.js"></script>
</body>

</html>
